services:
  bot:
    build: .
    image: nerds-voice:latest
    container_name: nerds-voice
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "122:3000"
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
